<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Key | CricPulse API</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
<style>
body{background:linear-gradient(135deg,#e0e7ff,#fce7f3,#cffafe,#fef3c7);background-size:400% 400%;animation:bg 18s ease infinite}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.card{animation:rise .6s ease both}@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-10 text-slate-800 font-sans antialiased">
<div class="card w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">
  <div class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 p-6 text-center">
    <a href="/" class="inline-flex items-center gap-2 text-white font-extrabold text-xl">
      <span class="h-9 w-9 bg-white/20 rounded-lg flex items-center justify-center">&lt;/&gt;</span> CricPulseApi
    </a>
    <h1 class="text-white text-2xl font-black mt-3">Generate API Key</h1>
    <p class="text-indigo-100 text-sm">Apna email daal kar CricPulse API key generate karo</p>
  </div>

  <div class="p-6 space-y-4">
    <form method="post" class="space-y-4">
      <div>
        <label for="email" class="text-sm font-semibold">Email</label>
        <input id="email" name="email" type="email" required placeholder="you@example.com"
          class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>

      {% if error %}
      <p class="text-sm rounded-lg px-3 py-2 bg-rose-50 text-rose-700 font-medium">{{ error }}</p>
      {% endif %}

      <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-pink-600 hover:scale-[1.02] transition text-white font-bold py-2.5 rounded-lg shadow-lg shadow-red-500/30">
        <i class="fa-solid fa-key mr-1.5"></i> Generate API Key
      </button>
    </form>

    {% if api_key %}
    <div class="mt-4 p-4 rounded-xl bg-indigo-50/70 border border-indigo-200 space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-indigo-700">Your API Key</span>
        <span id="copyStatus" class="text-xs font-semibold text-emerald-600 hidden">Copied!</span>
      </div>
      <div id="apiKeyBox" class="font-mono text-xs sm:text-sm bg-white border border-slate-200 rounded-lg px-3 py-2.5 text-slate-800 break-all select-all">
        {{ api_key }}
      </div>
      <button type="button" onclick="copyApiKey()"
        class="w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 transition text-white font-semibold py-2 rounded-lg text-sm">
        <i class="fa-regular fa-copy mr-1.5"></i> Copy Key
      </button>
    </div>
    {% endif %}

    <p class="text-center text-sm text-slate-600 pt-1">
      <a href="/" class="text-indigo-600 font-semibold hover:underline">Home par wapas jao</a>
    </p>
  </div>
</div>

<script>
function copyApiKey() {
  const box = document.getElementById("apiKeyBox");
  const status = document.getElementById("copyStatus");
  if (!box) return;
  const keyText = box.innerText.trim();

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(keyText).then(() => {
      if (status) {
        status.classList.remove("hidden");
        setTimeout(() => status.classList.add("hidden"), 2000);
      }
    });
  }
}
</script>
</body>
</html>
